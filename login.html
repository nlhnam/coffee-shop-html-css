<!doctype html>
<html lang="vi">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wild Pine Coffee</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arvo:wght@700&family=Oswald:wght@700&display=swap"
    rel="stylesheet">
</head>

<body>
  <header class="header">
    <div class="header-container">
      <!-- Menu -->
      <nav class="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="#best-sellers-section-id" class="nav-link">Best sellers</a>
        <a href="shop.html" class="nav-link">Products</a>
        <a href="#" class="nav-link">Our Story</a>
      </nav>

      <!-- Logo -->
      <div class="logo-box">
        <!-- <img src="images/logoWPC.png" class="logo-img" alt="Wild Pine Coffee Logo" />
        <span class="logo-text">WILD PINE COFFEE</span> -->
        <a href="#" class="brand-logo">
          <span class="brand-main">WILD PINE</span>
            <span class="brand-sub">COFFEE & TEA</span>
            </a>
      </div>

      <!--Action box-->
      <div class="action-box">
        <button class="icon-btn">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <a class="icon-btn" href="login.html">
          <i class="fa-regular fa-user"></i>
        </a>
        <button class="cart-btn">
          <!-- Vòng tròn bao -->
          <div class="cart-circle">
            <i class="fa-solid fa-cart-shopping"></i>
          </div>
        </button>
      </div>
    </div>
  </header>

    <main class="auth-page">
      <div class="auth-wrapper">
        
    
        <div class="auth-column">
          <h1 class="auth-title">ĐĂNG NHẬP</h1>
          <p class="auth-subtitle">Chào mừng bạn quay trở lại với Wild Pine Coffee.</p>

          <form class="auth-form">
            <div class="form-group">
              <label for="login-email" class="form-label">Email</label>
              <input 
                type="email" 
                id="login-email" 
                class="form-input" 
                placeholder="name@example.com" 
                required 
              />
            </div>

            <div class="form-group">
              <div class="label-row">
                <label for="login-password" class="form-label">Mật khẩu</label>
                <a href="#" class="forgot-link">Quên mật khẩu?</a>
              </div>
              <input 
                type="password" 
                id="login-password" 
                class="form-input" 
                placeholder="Nhập mật khẩu của bạn" 
                required 
              />
            </div>

            <button type="submit" class="auth-btn">Đăng nhập</button>
          </form>
        </div>

       
        <div class="auth-divider"></div>

        <div class="auth-column">
          <h2 class="auth-title">TẠO TÀI KHOẢN</h2>
          <p class="auth-subtitle">Đăng ký để theo dõi đơn hàng và nhận ưu đãi rang xay mới.</p>

          <form class="auth-form">
            <div class="form-group">
              <label for="reg-name" class="form-label">Họ và tên</label>
              <input 
                type="text" 
                id="reg-name" 
                class="form-input" 
                placeholder="Nguyễn Văn A" 
                required 
              />
            </div>

            <div class="form-group">
              <label for="reg-email" class="form-label">Email</label>
              <input 
                type="email" 
                id="reg-email" 
                class="form-input" 
                placeholder="name@example.com" 
                required 
              />
            </div>

            <div class="form-group">
              <label for="reg-password" class="form-label">Mật khẩu</label>
              <input 
                type="password" 
                id="reg-password" 
                class="form-input" 
                placeholder="Tối thiểu 8 ký tự" 
                required 
              />
            </div>

            <div class="form-group">
              <label for="reg-confirm" class="form-label">Xác nhận mật khẩu</label>
              <input 
                type="password" 
                id="reg-confirm" 
                class="form-input" 
                placeholder="Nhập lại mật khẩu" 
                required 
              />
            </div>

            <!-- Dùng thêm class .outline để tạo nút viền đen nền trắng giúp phân biệt 2 cột -->
            <button type="submit" class="auth-btn outline">Đăng ký</button>
          </form>
        </div>

      </div>
    </main>
  </body>
</html>
